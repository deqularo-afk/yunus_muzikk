name: Build Android APK

on:
  push:
    branches: [ "ana", "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          ZIP_DOSYASI=$(ls *.zip | head -n 1)
          echo "Bulunan zip: $ZIP_DOSYASI"
          unzip -q "$ZIP_DOSYASI" -d extracted_folder

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install Dependencies
        run: |
          cd extracted_folder/*
          flutter pub get

      - name: Build APK
        run: |
          cd extracted_folder/*
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yunus-music-apk
          path: extracted_folder/*/build/app/outputs/flutter-apk/app-release.apk
